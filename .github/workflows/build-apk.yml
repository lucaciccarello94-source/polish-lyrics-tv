# Builds the Fire TV receiver APK in the cloud and publishes it as the "tv-latest" release,
# so the Fire TV can download it directly with the Downloader app.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner already has the Android SDK; only accept licenses and add platform-tools
      # (the action's default also asks for the long-removed "tools" package and fails).
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: polish-lyrics-tv
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release "tv-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk polish-lyrics-tv.apk
          gh release delete tv-latest --yes --cleanup-tag || true
          gh release create tv-latest polish-lyrics-tv.apk \
            --title "Polish Lyrics TV (latest)" \
            --notes "Debug build for sideloading on Fire TV. Download: https://github.com/${{ github.repository }}/releases/download/tv-latest/polish-lyrics-tv.apk"
